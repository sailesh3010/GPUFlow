apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpunodes.gpuflow.io
spec:
  group: gpuflow.io
  names:
    kind: GPUNode
    listKind: GPUNodeList
    plural: gpunodes
    singular: gpunode
    shortNames:
      - gn
      - gnode
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Model
          type: string
          jsonPath: .spec.gpu.model
        - name: TotalGPUs
          type: integer
          jsonPath: .spec.gpu.count
        - name: Allocated
          type: integer
          jsonPath: .status.allocatedGPUs
        - name: Available
          type: integer
          jsonPath: .status.availableGPUs
        - name: Topology
          type: string
          jsonPath: .spec.topology.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - provider
                - gpu
              properties:
                provider:
                  type: string
                region:
                  type: string
                rack:
                  type: string
                gpu:
                  type: object
                  required:
                    - model
                    - count
                    - memoryGB
                  properties:
                    model:
                      type: string
                      enum:
                        - H100
                        - A100
                        - L40S
                    count:
                      type: integer
                      minimum: 1
                    memoryGB:
                      type: integer
                      minimum: 1
                topology:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - NVLINK
                        - PCIE
                        - NONE
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - DISCOVERED
                    - PROVISIONING
                    - OS_READY
                    - DRIVER_INSTALLING
                    - CUDA_READY
                    - VALIDATING
                    - READY
                    - ALLOCATED
                    - DRAINING
                    - DEGRADED
                    - FAILED
                    - REPAIRING
                    - DECOMMISSIONING
                    - DECOMMISSIONED
                health:
                  type: string
                  enum:
                    - HEALTHY
                    - DEGRADED
                    - FAILED
                    - UNKNOWN
                allocatedGPUs:
                  type: integer
                availableGPUs:
                  type: integer
                gpus:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      model:
                        type: string
                      memoryGB:
                        type: integer
                      utilization:
                        type: integer
                      temperature:
                        type: integer
                      health:
                        type: string
                      allocated:
                        type: boolean
                      workloadId:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                stateTransitions:
                  type: array
                  items:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                      nodeId:
                        type: string
                      previousState:
                        type: string
                      newState:
                        type: string
                      reason:
                        type: string
                      correlationId:
                        type: string
