apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control-plane
  labels:
    app.kubernetes.io/name: gpuflow
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gpuflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpuflow
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: gpuflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/gpuflow", "serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: GPUFLOW_PROFILE
              value: {{ .Values.config.profile | quote }}
            - name: GPUFLOW_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: GPUFLOW_TEMPORAL_HOSTPORT
              value: {{ .Values.config.temporal.hostPort | quote }}
            - name: GPUFLOW_KAFKA_BROKERS
              value: {{ .Values.config.kafka.brokers | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: gpuflow
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: gpuflow
    app.kubernetes.io/instance: {{ .Release.Name }}
